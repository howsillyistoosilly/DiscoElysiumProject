plugins {
    id "com.android.application"
}

def projectRoot = file("../")

android {
    namespace "com.discocheck.widget"
    compileSdk 35

    defaultConfig {
        applicationId "com.discocheck.widget"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    sourceSets {
        main {
            assets.srcDir("$projectRoot/android/generated-assets")
        }
    }
}

tasks.register("stageWidgetAssets", Copy) {
    from("$projectRoot/web") {
        include "index.html", "widget.js"
    }
    into("$projectRoot/android/generated-assets")
    rename("widget.js", "widget.js")
}

tasks.register("stageImageAssets", Copy) {
    from("$projectRoot/disco-backend/assets")
    into("$projectRoot/android/generated-assets/assets")
}

tasks.named("preBuild") {
    dependsOn("stageWidgetAssets", "stageImageAssets")
}
