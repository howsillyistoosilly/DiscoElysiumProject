<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090909">
  <title>Disco Check</title>
  <style>
    :root { color-scheme: dark; font-family: Georgia, serif; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 18px;
      color: #f5f5f5;
      background: #090909;
    }
    #widget {
      width: min(100%, 420px);
      height: min(78vh, 520px);
      min-height: 320px;
      border: 1px solid #5a5a5a;
      border-radius: 24px;
      overflow: hidden;
      position: relative;
      background: #111;
      box-shadow: 0 20px 50px #000b;
      cursor: pointer;
      user-select: none;
      border-color: var(--accent, #5a5a5a);
    }
    .portrait { position: absolute; inset: 0; background: center/cover no-repeat #111; }
    .content {
      position: absolute;
      inset: auto 0 0;
      height: var(--content-height, 170px);
      padding: 42px 18px 14px;
      background: linear-gradient(to bottom, #1110 0%, #111a 35%, #111e 72%, #111 100%);
    }
    .topbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 48px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      z-index: 3;
    }
    .header {
      flex: 1;
      overflow: hidden;
      color: #d0d0d0;
      font-size: 10px;
      letter-spacing: .06em;
      text-transform: uppercase;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-shadow: 0 1px 4px #000;
      opacity: .68;
    }
    .header.critical { color: #d71921; }
    .quote {
      height: 100%;
      overflow: hidden;
      margin: 0;
      padding-right: 48px;
      color: #d2d2d2;
      font-size: var(--quote-size, .9rem);
      line-height: 1.45;
      overflow-wrap: anywhere;
    }
    .dice { display: flex; gap: 4px; }
    .dice img {
      width: 24px;
      height: 24px;
      padding: 3px;
      image-rendering: pixelated;
      background: #f5f5f5;
      filter: invert(1);
      opacity: .78;
    }
    .photo-toggle { display: none; }
    .roll-flash { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
    .roll-flash.flash { background: #58c87830; box-shadow: inset 0 0 44px #58c87866; }
  </style>
</head>
<body>
  <main id="widget" tabindex="0" role="button" aria-label="Roll Disco Check">
    <div id="roll-flash" class="roll-flash"></div>
    <div class="topbar"><span id="header">READY</span><div id="dice" class="dice"></div></div>
    <div id="portrait" class="portrait"></div>
    <div class="content"><div id="quote" class="quote">Tap anywhere to run the check.</div></div>
    <button id="photo-toggle" class="photo-toggle" type="button" aria-hidden="true"></button>
  </main>
  <script src="widget.js"></script>
</body>
</html>
