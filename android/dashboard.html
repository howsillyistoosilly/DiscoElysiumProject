<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Disco Check Dashboard</title>
  <style>
    :root { color-scheme: dark; font-family: Georgia, serif; }
    body { margin: 0; padding: 20px 16px 36px; color: #f3f3f3; background: #090909; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
    h1 { margin: 0; font-size: 22px; letter-spacing: .08em; }
    p { color: #999; font-size: 12px; line-height: 1.4; }
    button { border: 1px solid #8170b2; border-radius: 999px; padding: 9px 13px; color: #fff; background: #201b2e; }
    #status { min-height: 16px; color: #9cdda9; font-size: 12px; }
    .line { margin: 10px 0; padding: 12px; border: 1px solid #333; border-radius: 14px; background: #151515; }
    label { display: block; margin-bottom: 7px; color: #b7a6e5; font-size: 10px; letter-spacing: .1em; }
    input, textarea { box-sizing: border-box; width: 100%; border: 1px solid #383838; border-radius: 8px; padding: 9px; color: #eee; background: #0e0e0e; font: inherit; }
    textarea { min-height: 76px; resize: vertical; line-height: 1.4; }
    .line + .line { margin-top: 8px; }
  </style>
</head>
<body>
  <header>
    <div><h1>DISCO CHECK</h1><p>Edit the lines used by your dashboard. Changes are saved on this phone.</p></div>
    <button id="save" type="button">SAVE</button>
  </header>
  <div id="status" role="status"></div>
  <main id="lines"></main>
  <script src="dashboard.js"></script>
</body>
</html>
