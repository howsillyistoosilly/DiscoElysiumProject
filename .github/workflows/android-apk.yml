name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Create release signing key
        working-directory: android
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -storepass disco-check \
            -keypass disco-check \
            -alias disco-check \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Disco Check, OU=Disco Check, O=Disco Check, L=Unknown, S=Unknown, C=US"
      - name: Build signed APK
        working-directory: android
        run: gradle assembleRelease
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "disco-check-${GITHUB_REF_NAME}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: disco-check-${{ github.ref_name }}-apk
          path: disco-check-${{ github.ref_name }}.apk
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "disco-check-${GITHUB_REF_NAME}.apk" \
            --title "Disco Check ${GITHUB_REF_NAME}" \
            --generate-notes
